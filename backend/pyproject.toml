[tool.black]
line-length = 100
extend-exclude = "venv|alembic/versions"

[tool.ruff]
line-length = 100
exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends() in default arguments is the documented idiom.

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["venv", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
